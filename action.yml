name: "ShellHub CI Debug"
description: "Register the CI runner as an ephemeral ShellHub device for audited SSH debug access through your own gateway"
author: "ShellHub"
branding:
  icon: "terminal"
  color: "blue"

inputs:
  server:
    description: "ShellHub server address (e.g. https://cloud.shellhub.io)"
    required: true
  tenant-id:
    description: "ShellHub namespace tenant ID. Required: the agent registers by tenant, and the API blocks API keys from listing namespaces."
    required: true
  api-key:
    description: "ShellHub API key with device accept/remove permission. Store as a secret."
    required: true
  name:
    description: "Device name. Defaults to a unique per-run name."
    required: false
    default: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
  tags:
    description: "Comma-separated tags to apply to the device (for access scoping). Tag names must be alphanumeric and at least 3 characters."
    required: false
    default: "github"
  public-key:
    description: "SSH public key(s) to authorize for connecting, in authorized_keys format (one per line). Scoped to the device's tags. Leave empty to manage keys yourself in ShellHub."
    required: false
    default: ""
  authorize-actor:
    description: "Authorize the GitHub public keys of the user who triggered the run (from github.com/<actor>.keys), scoped to the device's tags. Use 'true' to require them (warns if the actor has none) or 'auto' for best-effort (silent if none)."
    required: false
    default: "false"
  ssh-username:
    description: "Username (regexp) the authorized key may log in as. Defaults to any; the agent runs as root and can open a shell as any host user (root, the job user, etc.). Set a concrete value to lock it down and to have it shown in the printed SSHID."
    required: false
    default: ".*"
  detached:
    description: "If true, the job continues while the SSH session stays reachable. If false (default), the job blocks until you connect and disconnect, or you touch the continue file."
    required: false
    default: "false"
  timeout:
    description: "Blocking mode: seconds to wait for an SSH connection. Once connected, the job is held until you disconnect (or run 'sudo touch /continue'). 0 = wait indefinitely for a connection."
    required: false
    default: "0"
  idle-timeout:
    description: "Detached mode: seconds the post step waits at job end for an SSH connection before tearing down. Once connected, it holds until you disconnect. 0 = tear down immediately."
    required: false
    default: "0"
  agent-version:
    description: "Pin the agent version. Defaults to the server's reported version."
    required: false
    default: ""
  install-url:
    description: "Override the install script URL. Defaults to <server>/install.sh."
    required: false
    default: ""

outputs:
  sshid:
    description: "The device SSHID (namespace.device@host), without the username."
  ssh-command:
    description: "The full ssh command to connect, including the resolved username."
  web-url:
    description: "Browser URL that opens the runner's web terminal in the ShellHub console."
  device-uid:
    description: "The ephemeral device UID."

runs:
  using: "node24"
  main: "index.js"
  post: "index.js"
  post-if: "!cancelled()"
