name: integration

# Real end-to-end test: brings up a self-hosted ShellHub (pinned release), seeds
# a namespace + API key entirely through the API, runs the action against it, and
# asserts the runner registered, was accepted, and is online. No mocks.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  SHELLHUB_VERSION: v0.25.1
  DEVICE_NAME: ci-it-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bring up ShellHub ${{ env.SHELLHUB_VERSION }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SHELLHUB_VERSION" \
            https://github.com/shellhub-io/shellhub.git shellhub
          cd shellhub
          echo "SHELLHUB_DIR=$PWD" >> "$GITHUB_ENV"
          # Overrides win over .env. production avoids the dev compose files; the
          # runner already has something on host port 22, so move ShellHub's SSH
          # port out of the way (the agent connects outbound, so this is only the
          # external SSH listener).
          cat > .env.override <<EOF
          SHELLHUB_ENV=production
          SHELLHUB_VERSION=${SHELLHUB_VERSION}
          SHELLHUB_DATABASE=postgres
          SHELLHUB_SSH_PORT=2222
          EOF
          # The compose mounts pre-generated RSA keys as secrets.
          make keygen
          # The wrapper reads .env.override and assembles the right compose files
          # (postgres backend, no dev mounts) for us.
          ./bin/docker-compose up -d

      - name: Wait for the API
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/info >/dev/null 2>&1; then
              echo "ShellHub is up:"; curl -fsS http://localhost/info; echo; exit 0
            fi
            sleep 5
          done
          echo "ShellHub did not come up in time"; (cd "$SHELLHUB_DIR" && ./bin/docker-compose logs --tail=80); exit 1

      - name: Seed namespace and API key
        id: seed
        run: |
          set -euo pipefail
          BASE=http://localhost
          PASS='Passw0rd!123'
          # 1. first-run setup creates the admin user
          curl -fsS -X POST "$BASE/api/setup" -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@ci.local\",\"name\":\"CI Admin\",\"username\":\"ciadmin\",\"password\":\"$PASS\"}"
          # 2. login -> user JWT
          token=$(curl -fsS -X POST "$BASE/api/login" -H 'Content-Type: application/json' \
            -d "{\"username\":\"ciadmin\",\"password\":\"$PASS\"}" | jq -r .token)
          # 3. create namespace -> tenant id
          tenant=$(curl -fsS -X POST "$BASE/api/namespaces" -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d '{"name":"ci","type":"team"}' \
            | jq -r '.tenant_id // .tenant')
          # 4. swap to a tenant-scoped JWT (the gateway sets X-Tenant-ID from the token)
          stoken=$(curl -fsS "$BASE/api/auth/token/$tenant" -H "Authorization: Bearer $token" | jq -r .token)
          # 5. create the API key with a value we choose, so we don't depend on the response
          apikey=$(cat /proc/sys/kernel/random/uuid)
          curl -fsS -X POST "$BASE/api/namespaces/api-key" -H "Authorization: Bearer $stoken" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"ci-action\",\"expires_at\":-1,\"key\":\"$apikey\",\"role\":\"administrator\"}"
          echo "::add-mask::$apikey"
          echo "tenant=$tenant" >> "$GITHUB_OUTPUT"
          echo "apikey=$apikey" >> "$GITHUB_OUTPUT"
          echo "Seeded namespace tenant=$tenant"

      - name: Register this runner with ShellHub (action under test)
        uses: ./
        with:
          server: http://localhost
          tenant-id: ${{ steps.seed.outputs.tenant }}
          api-key: ${{ steps.seed.outputs.apikey }}
          name: ${{ env.DEVICE_NAME }}
          detached: true

      - name: Assert the runner is registered, accepted and online
        run: |
          set -euo pipefail
          BASE=http://localhost
          KEY='${{ steps.seed.outputs.apikey }}'
          uid=$(curl -fsS -H "X-API-Key: $KEY" "$BASE/api/devices?status=accepted&per_page=100" \
            | jq -r --arg n "$DEVICE_NAME" '.[] | select(.name==$n) | .uid')
          if [ -z "$uid" ]; then
            echo "device '$DEVICE_NAME' not found/accepted; current devices:"
            curl -fsS -H "X-API-Key: $KEY" "$BASE/api/devices?per_page=100" | jq -r '.[] | "\(.name) \(.status) online=\(.online)"'
            exit 1
          fi
          online=$(curl -fsS -H "X-API-Key: $KEY" "$BASE/api/devices/$uid" | jq -r .online)
          echo "device $uid accepted, online=$online"
          test "$online" = "true"

      - name: SSH into the runner through ShellHub and prove the host shell
        run: |
          set -euo pipefail
          BASE=http://localhost
          KEY='${{ steps.seed.outputs.apikey }}'
          # Register a public key scoped to the 'github' tag (the action tags the
          # device 'github') for any username. This is the auth model: a key the
          # user registers, scoped to the device by tag.
          ssh-keygen -t rsa -b 2048 -f ci_key -N '' -q
          data=$(base64 -w0 ci_key.pub)
          curl -fsS -X POST "$BASE/api/sshkeys/public-keys" -H "X-API-Key: $KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"ci\",\"username\":\".*\",\"data\":\"$data\",\"filter\":{\"tags\":[\"github\"]}}"
          # SSH back into THIS runner through the ShellHub gateway (resolves by
          # namespace name 'ci' + device name) and run a command on the host.
          out=$(ssh -i ci_key -p 2222 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "root@ci.$DEVICE_NAME@localhost" 'cat /etc/hostname')
          echo "hostname seen over ShellHub SSH: '$out' (runner: '$(cat /etc/hostname)')"
          test "$out" = "$(cat /etc/hostname)"

      - name: ShellHub logs on failure
        if: failure()
        run: cd "$SHELLHUB_DIR" && ./bin/docker-compose logs --tail=120
